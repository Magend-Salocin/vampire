<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Vampire — Éditeur de Carte</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{
  --red:#FF0000;--yellow:#FFFF00;--cyan:#00FFFF;--green:#00FF00;
  --bg:#0a0a0a;--panel:#111;--border:#FF0000;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:#fff;font-family:'Press Start 2P',monospace;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ── TOP BAR ── */
#topbar{
  display:flex;align-items:center;gap:6px;padding:6px 10px;
  background:#080808;border-bottom:2px solid var(--red);
  flex-shrink:0;flex-wrap:wrap;
}
.logo{color:var(--red);font-size:10px;letter-spacing:2px;margin-right:8px;}
.btn{
  background:#111;border:1px solid var(--red);color:var(--yellow);
  font-family:'Press Start 2P',monospace;font-size:7px;
  padding:5px 10px;cursor:pointer;transition:.1s;white-space:nowrap;
}
.btn:hover{background:var(--red);color:#000;}
.btn.active{background:var(--red);color:#000;}
.sep{width:1px;height:20px;background:#333;margin:0 4px;}
#mapTabs{display:flex;gap:3px;align-items:center;}
.tabBtn{
  background:#111;border:1px solid #500;color:#faa;
  font-family:'Press Start 2P',monospace;font-size:6px;
  padding:4px 8px;cursor:pointer;transition:.1s;
}
.tabBtn:hover{background:#500;}
.tabBtn.active{background:#AA0000;color:#fff;border-color:var(--red);}
.tabAdd{background:#0a0a0a;border:1px dashed #333;color:#555;
  font-size:10px;padding:3px 8px;cursor:pointer;}
.tabAdd:hover{border-color:#888;color:#aaa;}
#info{margin-left:auto;color:#555;font-size:6px;white-space:nowrap;}

/* ── MAIN LAYOUT ── */
#main{display:flex;flex:1;overflow:hidden;}

/* ── LEFT PANEL (tools) ── */
#leftPanel{
  width:52px;background:#0c0c0c;border-right:1px solid #222;
  display:flex;flex-direction:column;align-items:center;
  padding:6px 4px;gap:4px;flex-shrink:0;overflow-y:auto;
}
.toolBtn{
  width:40px;height:40px;background:#111;border:1px solid #333;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:.1s;flex-shrink:0;
}
.toolBtn:hover{border-color:#FF0000;background:#1a0000;}
.toolBtn.active{border-color:#FFFF00;background:#222200;}
.toolLabel{color:#444;font-size:5px;text-align:center;line-height:8px;}

/* ── CENTER (canvas) ── */
#canvasArea{
  flex:1;overflow:hidden;position:relative;background:#000;
  display:flex;align-items:center;justify-content:center;
}
#gameCanvas{
  image-rendering:pixelated;image-rendering:crisp-edges;
  cursor:crosshair;display:block;
}
/* Drag scroll overlay */
#canvasArea.dragging{cursor:grab;}

/* ── RIGHT PANEL (palette) ── */
#rightPanel{
  width:200px;background:#0c0c0c;border-left:1px solid #222;
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;
}
#palHeader{
  padding:6px 8px;border-bottom:1px solid #222;
  color:var(--red);font-size:7px;flex-shrink:0;
}
#catTabs{
  display:flex;flex-wrap:wrap;gap:2px;padding:4px;
  border-bottom:1px solid #222;flex-shrink:0;
}
.catBtn{
  background:#111;border:1px solid #333;color:#888;
  font-family:'Press Start 2P',monospace;font-size:5px;
  padding:3px 5px;cursor:pointer;
}
.catBtn:hover{color:#FFF;border-color:#888;}
.catBtn.active{background:#220000;border-color:var(--red);color:var(--yellow);}
#palette{
  flex:1;overflow-y:auto;padding:6px;
  display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;
}
.palItem{
  width:36px;height:36px;background:#111;border:1px solid #333;
  cursor:pointer;image-rendering:pixelated;position:relative;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.palItem:hover{border-color:#FFFF00;}
.palItem.selected{border-color:#FFFF00;border-width:2px;}
.palItem canvas{width:100%;height:100%;image-rendering:pixelated;}
.palItem .pName{
  position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.8);
  font-size:4px;color:#aaa;text-align:center;padding:1px;
  font-family:'Press Start 2P',monospace;
}

/* ── BOTTOM BAR ── */
#bottomBar{
  display:flex;align-items:center;gap:10px;padding:4px 10px;
  background:#080808;border-top:1px solid #222;flex-shrink:0;
}
#coords{color:#555;font-size:6px;min-width:120px;}
#tileInfo{color:#888;font-size:6px;}
#zoomInfo{color:#333;font-size:6px;margin-left:auto;}

/* ── MODAL ── */
#modal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);
  z-index:100;align-items:center;justify-content:center;
}
#modal.open{display:flex;}
#modalBox{
  background:#111;border:2px solid var(--red);padding:20px;min-width:300px;max-width:500px;
}
#modalBox h3{color:var(--red);font-size:9px;margin-bottom:14px;}
#modalBox p{color:#aaa;font-size:6px;line-height:14px;margin-bottom:12px;}
#modalBox textarea{
  width:100%;height:150px;background:#000;border:1px solid #333;
  color:var(--green);font-family:monospace;font-size:10px;padding:6px;resize:none;
}
#modalBtns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:#0a0a0a;}
::-webkit-scrollbar-thumb{background:#300;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span class="logo">🧛 VAMPIRE EDITOR</span>
  <div class="sep"></div>

  <!-- Map tabs -->
  <div id="mapTabs">
    <span style="color:#555;font-size:6px;margin-right:4px;">TABLEAU:</span>
  </div>
  <button class="tabAdd" id="btnAddMap" title="Nouveau tableau">＋</button>

  <div class="sep"></div>

  <!-- Tool buttons -->
  <button class="btn active" id="btnDraw">✏ DESSINER</button>
  <button class="btn" id="btnErase">✕ EFFACER</button>
  <button class="btn" id="btnFill">▦ REMPLIR</button>
  <button class="btn" id="btnSelect">⬜ SÉLECT.</button>
  <button class="btn" id="btnMove">✋ DÉPLACER</button>

  <div class="sep"></div>

  <button class="btn" id="btnUndo">↩ UNDO</button>
  <button class="btn" id="btnRedo">↪ REDO</button>

  <div class="sep"></div>

  <button class="btn" id="btnGrid">⊞ GRILLE</button>
  <button class="btn" id="btnPreview">👁 PREVIEW</button>
  <button class="btn" id="btnCollision">⚠ COLLISION</button>

  <div class="sep"></div>

  <button class="btn" id="btnExport">📥 EXPORTER</button>
  <button class="btn" id="btnImport">📤 IMPORTER</button>

  <span id="info">Prêt</span>
</div>

<!-- MAIN -->
<div id="main">

  <!-- LEFT: tools -->
  <div id="leftPanel">
    <div class="toolLabel">OUTILS</div>
    <div class="toolBtn active" id="tlDraw" title="Dessiner (D)">✏</div>
    <div class="toolBtn" id="tlErase" title="Effacer (E)">✕</div>
    <div class="toolBtn" id="tlFill" title="Remplir (F)">▦</div>
    <div class="toolBtn" id="tlEyedrop" title="Pipette (I)">💉</div>
    <div class="toolBtn" id="tlMove" title="Déplacer vue (M)">✋</div>
    <div class="sep" style="width:32px;height:1px;background:#222;"></div>
    <div class="toolLabel">ZOOM</div>
    <div class="toolBtn" id="tlZoomIn" title="Zoom + (=)">＋</div>
    <div class="toolBtn" id="tlZoomOut" title="Zoom - (-)">－</div>
    <div class="toolBtn" id="tlZoomFit" title="Ajuster (0)">⊡</div>
    <div class="sep" style="width:32px;height:1px;background:#222;"></div>
    <div class="toolLabel">VUE</div>
    <div class="toolBtn" id="tlGrid" title="Grille (G)">⊞</div>
    <div class="toolBtn" id="tlCollision" title="Collision (C)">⚠</div>
    <div class="toolBtn" id="tlPreview" title="Aperçu (P)">▶</div>
  </div>

  <!-- CENTER: canvas -->
  <div id="canvasArea">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- RIGHT: palette -->
  <div id="rightPanel">
    <div id="palHeader">🎨 PALETTE DE TUILES</div>
    <div id="catTabs">
      <button class="catBtn active" data-cat="all">TOUT</button>
      <button class="catBtn" data-cat="terrain">TERRAIN</button>
      <button class="catBtn" data-cat="decor">DÉCORS</button>
      <button class="catBtn" data-cat="special">SPÉCIAL</button>
    </div>
    <div id="palette"></div>
  </div>

</div>

<!-- BOTTOM BAR -->
<div id="bottomBar">
  <span id="coords">X:0 Y:0 | Col:0 Row:0</span>
  <span id="tileInfo">— Sélection: Herbe</span>
  <span id="zoomInfo">Zoom: 3x | Carte: 20×13</span>
</div>

<!-- MODAL (export/import) -->
<div id="modal">
  <div id="modalBox">
    <h3 id="modalTitle">EXPORTER JSON</h3>
    <p id="modalDesc">Copiez le JSON ci-dessous ou importez un fichier.</p>
    <textarea id="modalText" spellcheck="false"></textarea>
    <div id="modalBtns">
      <button class="btn" id="modalCopy">📋 COPIER</button>
      <button class="btn" id="modalDownload">💾 TÉLÉCHARGER</button>
      <button class="btn" id="modalClose">✕ FERMER</button>
    </div>
  </div>
</div>

// ── Map data structure ─────────────────────────────
// Each map: { id, name, bg, tiles[][], decorLayer[][] }
// tiles[row][col] = tile_id (base layer — terrain solide)
// decorLayer[row][col] = tile_id (decor layer — visuels non-solides)

function emptyLayer() {
  const t = [];
  for (let r = 0; r < GRID_ROWS; r++) t.push(new Array(GRID_COLS).fill(0));
  return t;
}

function makeMap(id, name, bg = '#000000') {
  return {
    id, name, bg,
    terrain: emptyLayer(),  // solid tiles
    decor:   emptyLayer(),  // visual decor (non-solid)
    meta: { spawnX: 2, spawnY: 10, nextRight: -1, nextLeft: -1 }
  };
}

// ── Canvas ─────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const canvasArea = document.getElementById('canvasArea');

function setCanvasSize() {
  const area = canvasArea.getBoundingClientRect();
  canvas.width = Math.floor(area.width);
  canvas.height = Math.floor(area.height);
  fitView();
}

function fitView() {
  const area = canvasArea.getBoundingClientRect();
  const zx = Math.floor(area.width / GW);
  const zy = Math.floor(area.height / GH);
  zoom = Math.max(1, Math.min(zx, zy));
  camX = Math.round((area.width  - GW * zoom) / 2);
  camY = Math.round((area.height - GH * zoom) / 2);
  render();
}

window.addEventListener('resize', () => { setCanvasSize(); });

// ── Draw a sprite from sheet ────────────────────────
function drawSpr(x, y, w, h, key, flipX = false) {
  if (!sheetOK) return;
  const r = SR[key];
  if (!r) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (flipX) {
    ctx.scale(-1, 1);
    ctx.drawImage(sheet, r.x, r.y, r.w, r.h, -(x + w), y, w, h);
  } else {
    ctx.drawImage(sheet, r.x, r.y, r.w, r.h, x, y, w, h);
  }
  ctx.restore();
}

// ── Render ─────────────────────────────────────────
function render() {
  const cw = canvas.width, ch = canvas.height;
  const map = maps[currentMap];

  // Clear
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  ctx.translate(camX, camY);
  ctx.scale(zoom, zoom);
  ctx.imageSmoothingEnabled = false;

  // Background
  ctx.fillStyle = map.bg || '#000000';
  ctx.fillRect(0, 0, GW, GH);

  if (!previewMode) {
    // Subtle playfield boundary
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(0, 0, GW, PLAY_H);
    // HUD area
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, PLAY_H, GW, HUD_H);
  }

  // ── Draw terrain layer ──
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      const tid = map.terrain[r][c];
      if (tid === 0) continue;
      const td = TILE_BY_ID[tid];
      if (!td) continue;
      drawTileAt(c * TS, r * TS, td, tid, 'terrain');
    }
  }

  // ── Draw decor layer ──
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      const tid = map.decor[r][c];
      if (tid === 0) continue;
      const td = TILE_BY_ID[tid];
      if (!td) continue;
      drawTileAt(c * TS, r * TS, td, tid, 'decor');
    }
  }

  // ── HUD preview ──
  drawHUDPreview(map);

  // ── Collision overlay ──
  if (showCollision) drawCollisionOverlay(map);

  // ── Grid ──
  if (showGrid && zoom >= 2) drawGrid();

  // ── Preview player (spawn) ──
  drawSpawnMarker(map);

  // ── Portal markers ──
  drawPortalMarkers(map);

  // ── Selection rect ──
  if (selActive && selStart && selEnd) drawSelection();

  // ── Cursor tile preview ──
  drawCursorPreview();

  ctx.restore();

  // Update status bar
  const col = Math.floor((mouseWorldX) / TS);
  const row = Math.floor((mouseWorldY) / TS);
  document.getElementById('coords').textContent =
    `X:${Math.round(mouseWorldX)} Y:${Math.round(mouseWorldY)} | Col:${col} Row:${row}`;
  document.getElementById('zoomInfo').textContent =
    `Zoom:${zoom}x | Carte:${GRID_COLS}×${GRID_ROWS} | Couche:${activeLayer.toUpperCase()}`;
}

function drawTileAt(px, py, td, tid, layer) {
  if (td.invisible && !showCollision) return;

  if (td.spr && sheetOK) {
    const r = SR[td.spr];
    if (!r) return;
    const tw = (td.wide || 1) * TS;
    const th = (td.tall || 1) * TS;
    // Anchor tall sprites at bottom of their grid cell
    const dy = py - (th - TS);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(sheet, r.x, r.y, r.w, r.h, px, dy, tw, th);
  } else if (td.draw === 'spawn') {
    // Yellow X marker
    ctx.strokeStyle = '#FFFF00';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px+TS, py+TS); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px+TS, py); ctx.lineTo(px, py+TS); ctx.stroke();
  } else if (td.draw === 'portal_r') {
    ctx.fillStyle = '#00FFFF44';
    ctx.fillRect(px, py, TS*2, TS*3);
    ctx.strokeStyle = '#00FFFF';
    ctx.lineWidth = 1;
    ctx.strokeRect(px, py, TS*2, TS*3);
    ctx.fillStyle = '#00FFFF';
    ctx.font = '6px monospace';
    ctx.fillText('→', px+1, py+TS*1.5);
  } else if (td.draw === 'portal_l') {
    ctx.fillStyle = '#00CCFF44';
    ctx.fillRect(px, py, TS*2, TS*3);
    ctx.strokeStyle = '#00CCFF';
    ctx.lineWidth = 1;
    ctx.strokeRect(px, py, TS*2, TS*3);
    ctx.fillStyle = '#00CCFF';
    ctx.font = '6px monospace';
    ctx.fillText('←', px+1, py+TS*1.5);
  } else if (td.color) {
    ctx.fillStyle = td.color;
    ctx.fillRect(px, py, (td.wide||1)*TS, (td.tall||1)*TS);
  }

  // Layer indicator in non-preview
  if (!previewMode && layer === 'decor') {
    ctx.fillStyle = 'rgba(0,0,255,0.06)';
    ctx.fillRect(px, py, (td.wide||1)*TS, TS);
  }
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 0.5;
  // Vertical
  for (let c = 0; c <= GRID_COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c*TS, 0); ctx.lineTo(c*TS, PLAY_H); ctx.stroke();
  }
  // Horizontal
  for (let r = 0; r <= GRID_ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r*TS); ctx.lineTo(GW, r*TS); ctx.stroke();
  }
  // HUD separator
  ctx.strokeStyle = 'rgba(255,0,0,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, PLAY_H); ctx.lineTo(GW, PLAY_H); ctx.stroke();
}

function drawCollisionOverlay(map) {
  ctx.save();
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      const tid = map.terrain[r][c];
      const td = TILE_BY_ID[tid];
      if (td && td.solid) {
        ctx.fillStyle = 'rgba(255,100,0,0.25)';
        ctx.fillRect(c*TS, r*TS, TS, TS);
        // Top edge (landing surface)
        ctx.fillStyle = 'rgba(255,150,0,0.8)';
        ctx.fillRect(c*TS, r*TS, TS, 1);
      }
    }
  }
  // Show "air" label over non-solid areas
  ctx.fillStyle = 'rgba(0,255,255,0.04)';
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      const tid = map.terrain[r][c];
      const td = TILE_BY_ID[tid];
      if (!td || !td.solid) {
        ctx.fillRect(c*TS, r*TS, TS, TS);
      }
    }
  }
  ctx.restore();
}

function drawHUDPreview(map) {
  // HUD area at y = PLAY_H (160) to GH (200)
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, PLAY_H, GW, HUD_H);

  // Life bar (atlas)
  if (sheetOK) {
    const lb = SR['hud_lifebar'];
    if (lb) {
      ctx.globalAlpha = 0.7;
      ctx.drawImage(sheet, lb.x, lb.y, lb.w, lb.h, 2, PLAY_H+2, 80, 14);
      ctx.globalAlpha = 1;
    }
    // Inventory frame
    const inv = SR['hud_invframe'];
    if (inv) {
      ctx.globalAlpha = 0.6;
      ctx.drawImage(sheet, inv.x, inv.y, inv.w, inv.h, 2, PLAY_H+18, 30, 18);
      ctx.globalAlpha = 1;
    }
    // Vampire logo (center)
    const logo = SR['hud_logo'];
    if (logo) {
      ctx.globalAlpha = 0.85;
      ctx.drawImage(sheet, logo.x, logo.y, logo.w, logo.h, GW/2-70, PLAY_H+2, 140, 36);
      ctx.globalAlpha = 1;
    }
    // Moon (right)
    const moon = SR['moon2'];
    if (moon) {
      ctx.globalAlpha = 0.8;
      ctx.drawImage(sheet, moon.x, moon.y, moon.w, moon.h, GW-22, PLAY_H+4, 18, 18);
      ctx.globalAlpha = 1;
    }
  }
  // HP bar fill
  ctx.fillStyle = '#FF0000';
  ctx.fillRect(4, PLAY_H+6, 50, 5);
  // border
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(3, PLAY_H+5, 72, 7);
}

function drawSpawnMarker(map) {
  const sx = map.meta.spawnX * TS;
  const sy = map.meta.spawnY * TS;
  // Draw player sprite preview
  if (sheetOK) {
    const r = SR['hero_idle1'];
    if (r) {
      ctx.globalAlpha = 0.9;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sheet, r.x, r.y, r.w, r.h, sx, sy, TS, Math.round(TS * r.h / r.w));
      ctx.globalAlpha = 1;
    }
  }
  // Spawn marker circle
  ctx.strokeStyle = '#FFFF00';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.arc(sx + TS/2, sy + TS, TS*1.2, 0, Math.PI*2);
  ctx.stroke();
  if (!previewMode) {
    ctx.fillStyle = '#FFFF0088';
    ctx.font = '4px monospace';
    ctx.fillText('SPAWN', sx-2, sy-2);
  }
}

function drawPortalMarkers(map) {
  if (previewMode) return;
  const m = map.meta;
  if (m.nextRight >= 0) {
    ctx.fillStyle = 'rgba(0,255,255,0.15)';
    ctx.fillRect(GW - TS*2, 0, TS*2, PLAY_H);
    ctx.strokeStyle = '#00FFFF';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.strokeRect(GW - TS*2, 0, TS*2, PLAY_H);
    ctx.setLineDash([]);
    ctx.fillStyle = '#00FFFF';
    ctx.font = '4px monospace';
    ctx.fillText('→T'+(m.nextRight+1), GW-TS*2+1, 8);
  }
  if (m.nextLeft >= 0) {
    ctx.fillStyle = 'rgba(0,200,255,0.15)';
    ctx.fillRect(0, 0, TS*2, PLAY_H);
    ctx.strokeStyle = '#00CCFF';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.strokeRect(0, 0, TS*2, PLAY_H);
    ctx.setLineDash([]);
    ctx.fillStyle = '#00CCFF';
    ctx.font = '4px monospace';
    ctx.fillText('←T'+(m.nextLeft+1), 2, 8);
  }
}

function drawSelection() {
  const x1 = Math.min(selStart.c, selEnd.c) * TS;
  const y1 = Math.min(selStart.r, selEnd.r) * TS;
  const x2 = (Math.max(selStart.c, selEnd.c) + 1) * TS;
  const y2 = (Math.max(selStart.r, selEnd.r) + 1) * TS;
  ctx.fillStyle = 'rgba(255,255,0,0.1)';
  ctx.fillRect(x1, y1, x2-x1, y2-y1);
  ctx.strokeStyle = '#FFFF00';
  ctx.lineWidth = 1;
  ctx.setLineDash([3,3]);
  ctx.strokeRect(x1, y1, x2-x1, y2-y1);
  ctx.setLineDash([]);
}

function drawCursorPreview() {
  if (tool !== 'draw') return;
  const col = Math.floor(mouseWorldX / TS);
  const row = Math.floor(mouseWorldY / TS);
  if (col < 0 || col >= GRID_COLS || row < 0 || row >= GRID_ROWS) return;
  const td = TILE_BY_ID[selectedTile];
  if (!td || td.id === 0) {
    // Erase preview
    ctx.fillStyle = 'rgba(255,0,0,0.2)';
    ctx.fillRect(col*TS, row*TS, TS, TS);
    return;
  }
  ctx.globalAlpha = 0.55;
  if (td.spr && sheetOK) {
    const r = SR[td.spr];
    if (r) {
      const tw = (td.wide||1)*TS, th = (td.tall||1)*TS;
      const dy = row*TS - (th - TS);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sheet, r.x, r.y, r.w, r.h, col*TS, dy, tw, th);
    }
  } else if (td.color) {
    ctx.fillStyle = td.color;
    ctx.fillRect(col*TS, row*TS, (td.wide||1)*TS, (td.tall||1)*TS);
  }
  ctx.globalAlpha = 1;
  // Cursor border
  ctx.strokeStyle = '#FFFF00';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(col*TS, row*TS, (td.wide||1)*TS, (td.tall||1)*TS);
}

// ── Tile operations ────────────────────────────────
function canvasToWorld(cx, cy) {
  return {
    x: (cx - camX) / zoom,
    y: (cy - camY) / zoom
  };
}

function worldToTile(wx, wy) {
  return {
    col: Math.floor(wx / TS),
    row: Math.floor(wy / TS)
  };
}

function inBounds(col, row) {
  return col >= 0 && col < GRID_COLS && row >= 0 && row < GRID_ROWS;
}

function getLayer(which) {
  return maps[currentMap][which];
}

function paintTile(col, row) {
  if (!inBounds(col, row)) return;
  const layer = getLayer(activeLayer);
  const was = layer[row][col];
  if (was === selectedTile) return;
  pushUndo();
  layer[row][col] = selectedTile;
  // If placing spawn, update meta
  if (selectedTile === 18) {
    maps[currentMap].meta.spawnX = col;
    maps[currentMap].meta.spawnY = row;
    layer[row][col] = 0; // don't actually store in layer
  }
  render();
}

function eraseTile(col, row) {
  if (!inBounds(col, row)) return;
  const layer = getLayer(activeLayer);
  if (layer[row][col] === 0) return;
  pushUndo();
  layer[row][col] = 0;
  render();
}

function fillTool(col, row) {
  if (!inBounds(col, row)) return;
  const layer = getLayer(activeLayer);
  const targetId = layer[row][col];
  if (targetId === selectedTile) return;
  pushUndo();
  const visited = new Set();
  const queue = [[col, row]];
  while (queue.length) {
    const [c, r] = queue.pop();
    const key = r * GRID_COLS + c;
    if (!inBounds(c, r) || visited.has(key)) continue;
    visited.add(key);
    if (layer[r][c] !== targetId) continue;
    layer[r][c] = selectedTile;
    queue.push([c+1,r],[c-1,r],[c,r+1],[c,r-1]);
  }
  render();
}

// ── Undo/Redo ──────────────────────────────────────
function cloneMapState() {
  const m = maps[currentMap];
  return {
    terrain: m.terrain.map(r => [...r]),
    decor: m.decor.map(r => [...r]),
    meta: { ...m.meta }
  };
}

function pushUndo() {
  undoStack.push(cloneMapState());
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
}

function doUndo() {
  if (!undoStack.length) return;
  redoStack.push(cloneMapState());
  const s = undoStack.pop();
  const m = maps[currentMap];
  m.terrain = s.terrain; m.decor = s.decor; m.meta = s.meta;
  render();
}

function doRedo() {
  if (!redoStack.length) return;
  undoStack.push(cloneMapState());
  const s = redoStack.pop();
  const m = maps[currentMap];
  m.terrain = s.terrain; m.decor = s.decor; m.meta = s.meta;
  render();
}

// ── Map tabs ───────────────────────────────────────
function rebuildTabs() {
  const container = document.getElementById('mapTabs');
  container.innerHTML = '<span style="color:#555;font-size:6px;margin-right:4px;">TABLEAU:</span>';
  maps.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'tabBtn' + (i === currentMap ? ' active' : '');
    btn.textContent = (i+1) + '. ' + m.name;
    btn.onclick = () => { currentMap = i; rebuildTabs(); render(); };
    // Right-click to rename
    btn.addEventListener('contextmenu', e => {
      e.preventDefault();
      const name = prompt('Renommer le tableau:', m.name);
      if (name) { m.name = name.trim(); rebuildTabs(); }
    });
    container.appendChild(btn);
  });
}

function addMap() {
  const name = prompt('Nom du nouveau tableau:', 'Tableau ' + (maps.length + 1));
  if (!name) return;
  maps.push(makeMap(maps.length, name.trim()));
  currentMap = maps.length - 1;
  rebuildTabs();
  render();
}

// ── Palette ────────────────────────────────────────
function buildPalette() {
  const container = document.getElementById('palette');
  container.innerHTML = '';
  const filtered = activeCategory === 'all' ? TILES : TILES.filter(t => t.cat === activeCategory);
  filtered.forEach(td => {
    const item = document.createElement('div');
    item.className = 'palItem' + (td.id === selectedTile ? ' selected' : '');
    item.title = td.name + (td.solid ? ' [SOLIDE]' : ' [PASSABLE]');
    // Mini preview canvas
    const cv = document.createElement('canvas');
    cv.width = 16; cv.height = 16;
    cv.style.cssText = 'width:100%;height:100%;image-rendering:pixelated;';
    const c2 = cv.getContext('2d');
    c2.imageSmoothingEnabled = false;
    if (td.spr && sheetOK) {
      const r = SR[td.spr];
      if (r) c2.drawImage(sheet, r.x, r.y, r.w, r.h, 0, 0, 16, 16);
    } else if (td.draw === 'spawn') {
      c2.strokeStyle = '#FFFF00'; c2.lineWidth = 2;
      c2.beginPath(); c2.moveTo(0,0); c2.lineTo(16,16); c2.stroke();
      c2.beginPath(); c2.moveTo(16,0); c2.lineTo(0,16); c2.stroke();
    } else if (td.color) {
      c2.fillStyle = td.color; c2.fillRect(0,0,16,16);
    } else {
      // Empty (void)
      c2.fillStyle = '#111'; c2.fillRect(0,0,16,16);
      c2.strokeStyle = '#333'; c2.lineWidth = 1;
      c2.beginPath(); c2.moveTo(0,0); c2.lineTo(16,16); c2.stroke();
    }
    // Solid indicator
    if (td.solid) {
      c2.fillStyle = 'rgba(255,100,0,0.4)';
      c2.fillRect(0, 0, 5, 5);
    }
    item.appendChild(cv);
    const label = document.createElement('div');
    label.className = 'pName';
    label.textContent = td.name.length > 7 ? td.name.slice(0,6)+'…' : td.name;
    item.appendChild(label);
    item.onclick = () => {
      selectedTile = td.id;
      document.querySelectorAll('.palItem').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
      document.getElementById('tileInfo').textContent = '— ' + td.name + (td.solid ? ' ⬛ solide' : ' 🔳 passable');
      render();
    };
    container.appendChild(item);
  });
}

// Category tabs
document.querySelectorAll('.catBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeCategory = btn.dataset.cat;
    document.querySelectorAll('.catBtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    buildPalette();
  });
});

// ── Layer switching ────────────────────────────────
// We switch layer based on selected tile category
// terrain tiles → terrain layer; decor/special → decor layer
function autoSelectLayer(tileId) {
  const td = TILE_BY_ID[tileId];
  if (!td) return;
  activeLayer = (td.cat === 'terrain') ? 'terrain' : 'decor';
  document.getElementById('info').textContent =
    'Couche: ' + activeLayer.toUpperCase() + ' | ' + td.name;
}

// ── Mouse events ───────────────────────────────────
canvas.addEventListener('mousedown', e => {
  const w = canvasToWorld(e.offsetX, e.offsetY);
  mouseWorldX = w.x; mouseWorldY = w.y;
  if (e.button === 1 || tool === 'move') {
    isPanning = true;
    panStartX = e.clientX; panStartY = e.clientY;
    panCamX = camX; panCamY = camY;
    canvasArea.classList.add('dragging');
    return;
  }
  if (e.button === 0) {
    isDrawing = true;
    const { col, row } = worldToTile(w.x, w.y);
    if (tool === 'draw') { autoSelectLayer(selectedTile); paintTile(col, row); lastTileC=col; lastTileR=row; }
    else if (tool === 'erase') { eraseTile(col, row); lastTileC=col; lastTileR=row; }
    else if (tool === 'fill') { autoSelectLayer(selectedTile); fillTool(col, row); }
    else if (tool === 'eyedrop') {
      const layer = getLayer(activeLayer);
      if (inBounds(col, row)) {
        const id = layer[row][col];
        if (id !== 0) {
          selectedTile = id;
          buildPalette();
          document.getElementById('tileInfo').textContent = '— ' + (TILE_BY_ID[id]?.name || '?');
        }
      }
    } else if (tool === 'select') {
      selStart = {c: col, r: row}; selEnd = {c: col, r: row}; selActive = true;
    }
  }
  e.preventDefault();
});

canvas.addEventListener('mousemove', e => {
  const w = canvasToWorld(e.offsetX, e.offsetY);
  mouseWorldX = w.x; mouseWorldY = w.y;

  if (isPanning) {
    camX = panCamX + (e.clientX - panStartX);
    camY = panCamY + (e.clientY - panStartY);
    render(); return;
  }
  if (isDrawing && e.button === 0) {
    const { col, row } = worldToTile(w.x, w.y);
    if (col !== lastTileC || row !== lastTileR) {
      if (tool === 'draw') { autoSelectLayer(selectedTile); paintTile(col, row); }
      else if (tool === 'erase') eraseTile(col, row);
      else if (tool === 'select' && selStart) { selEnd = {c: col, r: row}; }
      lastTileC = col; lastTileR = row;
    }
  }
  render();
});

canvas.addEventListener('mouseup', e => {
  isDrawing = false; isPanning = false;
  canvasArea.classList.remove('dragging');
});

canvas.addEventListener('mouseleave', () => {
  isDrawing = false; isPanning = false;
  canvasArea.classList.remove('dragging');
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const w = canvasToWorld(e.offsetX, e.offsetY);
  const prevZoom = zoom;
  if (e.deltaY < 0) zoom = Math.min(zoom+1, 8);
  else zoom = Math.max(1, zoom-1);
  if (zoom !== prevZoom) {
    // Zoom toward mouse position
    camX = e.offsetX - w.x * zoom;
    camY = e.offsetY - w.y * zoom;
  }
  render();
}, { passive: false });

// ── Keyboard shortcuts ─────────────────────────────
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key.toLowerCase();
  if (e.ctrlKey || e.metaKey) {
    if (k === 'z') { doUndo(); return; }
    if (k === 'y') { doRedo(); return; }
    if (k === 's') { e.preventDefault(); exportMap(); return; }
  }
  // Tool shortcuts
  if (k === 'd') setTool('draw');
  if (k === 'e') setTool('erase');
  if (k === 'f') setTool('fill');
  if (k === 'i') setTool('eyedrop');
  if (k === 'm') setTool('move');
  if (k === 'g') toggleGrid();
  if (k === 'c') toggleCollision();
  if (k === 'p') togglePreview();
  if (k === '=' || k === '+') { zoom = Math.min(zoom+1,8); render(); }
  if (k === '-') { zoom = Math.max(1,zoom-1); render(); }
  if (k === '0') fitView();
  // Layer switch
  if (k === '1') { activeLayer = 'terrain'; document.getElementById('info').textContent = 'Couche: TERRAIN'; }
  if (k === '2') { activeLayer = 'decor'; document.getElementById('info').textContent = 'Couche: DECOR'; }
  // Tab navigation
  if (k === 'tab') { e.preventDefault(); currentMap = (currentMap+1)%maps.length; rebuildTabs(); render(); }
});

// ── Tool switcher ──────────────────────────────────
function setTool(t) {
  tool = t;
  ['draw','erase','fill','eyedrop','move'].forEach(n => {
    const el = document.getElementById('tl' + n.charAt(0).toUpperCase() + n.slice(1));
    if (el) el.classList.toggle('active', n === t);
  });
  canvas.style.cursor = t === 'move' ? 'grab' : t === 'eyedrop' ? 'crosshair' : 'crosshair';
}

function toggleGrid() {
  showGrid = !showGrid;
  document.getElementById('tlGrid').classList.toggle('active', showGrid);
  document.getElementById('btnGrid').classList.toggle('active', showGrid);
  render();
}
function toggleCollision() {
  showCollision = !showCollision;
  document.getElementById('tlCollision').classList.toggle('active', showCollision);
  document.getElementById('btnCollision').classList.toggle('active', showCollision);
  render();
}
function togglePreview() {
  previewMode = !previewMode;
  document.getElementById('tlPreview').classList.toggle('active', previewMode);
  document.getElementById('btnPreview').classList.toggle('active', previewMode);
  render();
}

// ── Export / Import ────────────────────────────────
function exportMap() {
  const all = maps.map(m => ({
    id: m.id, name: m.name, bg: m.bg,
    terrain: m.terrain,
    decor: m.decor,
    meta: m.meta
  }));
  const json = JSON.stringify(all, null, 2);
  document.getElementById('modalTitle').textContent = 'EXPORTER JSON';
  document.getElementById('modalDesc').textContent = maps.length + ' tableau(x) — ' + json.length + ' caractères';
  document.getElementById('modalText').value = json;
  openModal();
}

function importMap() {
  document.getElementById('modalTitle').textContent = 'IMPORTER JSON';
  document.getElementById('modalDesc').textContent = 'Collez votre JSON ci-dessous puis fermez.';
  document.getElementById('modalText').value = '';
  openModal('import');
}

let modalMode = 'export';
function openModal(mode = 'export') {
  modalMode = mode;
  document.getElementById('modal').classList.add('open');
  document.getElementById('modalDownload').style.display = mode === 'export' ? '' : 'none';
}
function closeModal() {
  if (modalMode === 'import') {
    const txt = document.getElementById('modalText').value.trim();
    if (txt) {
      try {
        const data = JSON.parse(txt);
        if (Array.isArray(data)) {
          maps.length = 0;
          data.forEach((m, i) => {
            const nm = makeMap(i, m.name, m.bg);
            nm.terrain = m.terrain;
            nm.decor = m.decor || emptyLayer();
            nm.meta = m.meta || nm.meta;
            maps.push(nm);
          });
          currentMap = 0;
          rebuildTabs(); render();
          document.getElementById('info').textContent = maps.length + ' tableau(x) importés !';
        }
      } catch(err) { alert('JSON invalide: ' + err.message); return; }
    }
  }
  document.getElementById('modal').classList.remove('open');
}

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
document.getElementById('modalCopy').onclick = () => {
  document.getElementById('modalText').select();
  document.execCommand('copy');
  document.getElementById('modalCopy').textContent = '✓ COPIÉ';
  setTimeout(() => document.getElementById('modalCopy').textContent = '📋 COPIER', 1500);
};
document.getElementById('modalDownload').onclick = () => {
  const txt = document.getElementById('modalText').value;
  const a = document.createElement('a');
  a.href = 'data:application/json,' + encodeURIComponent(txt);
  a.download = 'vampire_maps.json'; a.click();
};

document.getElementById('tlDraw').onclick     = () => setTool('draw');
document.getElementById('tlErase').onclick    = () => setTool('erase');
document.getElementById('tlFill').onclick     = () => setTool('fill');
document.getElementById('tlEyedrop').onclick  = () => setTool('eyedrop');
document.getElementById('tlMove').onclick     = () => setTool('move');
document.getElementById('tlZoomIn').onclick   = () => { zoom=Math.min(zoom+1,8); render(); };
document.getElementById('tlZoomOut').onclick  = () => { zoom=Math.max(1,zoom-1); render(); };
document.getElementById('tlZoomFit').onclick  = fitView;
document.getElementById('tlGrid').onclick     = toggleGrid;
document.getElementById('tlCollision').onclick= toggleCollision;
document.getElementById('tlPreview').onclick  = togglePreview;

// Background color shortcut (double-click on canvas area outside map)
canvasArea.addEventListener('dblclick', e => {
  const w = canvasToWorld(e.offsetX, e.offsetY);
  if (w.x < 0 || w.x > GW || w.y < 0 || w.y > GH) {
    showMapSettings();
  }
});

// ── Context menu (right-click on canvas) ──────────
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  // Quick erase on right-click
  const w = canvasToWorld(e.offsetX, e.offsetY);
  const { col, row } = worldToTile(w.x, w.y);
  eraseTile(col, row);
  render();
});

// ── Transition (portal) settings ──────────────────
// Click on portal zone to configure
canvas.addEventListener('dblclick', e => {
  const w = canvasToWorld(e.offsetX, e.offsetY);
  if (w.y >= 0 && w.y < PLAY_H) {
    // Check if near right/left edge
    if (w.x > GW - TS*3) {
      const t = prompt('Tableau à droite (0-based index, -1 = aucun):', maps[currentMap].meta.nextRight);
      if (t !== null) { maps[currentMap].meta.nextRight = parseInt(t)||0; render(); }
    } else if (w.x < TS*3) {
      const t = prompt('Tableau à gauche (0-based index, -1 = aucun):', maps[currentMap].meta.nextLeft);
      if (t !== null) { maps[currentMap].meta.nextLeft = parseInt(t)||0; render(); }
    }
  }
});

// ── Init ───────────────────────────────────────────
setCanvasSize();
rebuildTabs();
setTool('draw');
toggleGrid(); // start with grid on (toggleGrid starts off, calling it enables it)

// Initial info
document.getElementById('tileInfo').textContent =
  '— Pierre jaune ⬛ solide | Clic droit = effacer | Ctrl+Z = annuler';
document.getElementById('info').textContent = '2 tableaux chargés (screenshots)';

// Keyboard hints in status
setTimeout(() => {
  document.getElementById('tileInfo').textContent =
    'D=dessiner E=effacer F=remplir G=grille C=collision P=preview 0=zoom fit';
}, 3000);
</script>
</body>
</html>
